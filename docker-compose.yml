# ==============================================================
# Módulo INVESTIGACIÓN — versión 1
#
#   FRONT Blazor (:8071) → API investigación (C#, :8070) → SQL Server
#
# TRES procesos, no dos. El front es una aplicación aparte que solo habla con
# la API por HTTP: no tiene línea hacia SQL Server, y no la va a tener nunca.
#
# Uso: docker compose up -d --build     (UN solo comando)
# Reset de la BD: docker compose down -v && docker compose up -d
#
# Este archivo declara TODO el sistema: la base, su inicializador, la API y
# el front. Un solo comando lo levanta.
#
# Compose v2 ignora la directiva 'version:' y advierte que está obsoleta:
# por eso no aparece.
# ==============================================================
services:

  # --- SQL Server 2022: el único motor del proyecto ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: investigacion-sqlserver
    restart: unless-stopped        # si se reinicia el PC, el motor revive solo
    environment:
      - ACCEPT_EULA=Y
      # Contraseña a la vista: excepción declarada del Artículo 7 — esta es
      # una plantilla didáctica que corre en contenedores desechables.
      # En un proyecto real va en el .env, fuera de git.
      - MSSQL_SA_PASSWORD=Aplicacionweb123!
    ports:
      - "11470:1433"               # 1433 es el puerto del motor adentro
    volumes:
      - mssqldata:/var/opt/mssql   # el directorio COMPLETO: datos, registros y secretos
    healthcheck:
      # No basta con que el contenedor exista: hay que saber si el motor ya
      # RESPONDE consultas. El contenedor arranca en un segundo; el motor
      # tarda entre 30 y 60 en aceptar conexiones.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s            # margen de gracia mientras arranca

  # --- Inicializador: crea la base y corre el script UNA vez, y se muere ---
  # SQL Server no ejecuta los scripts que se le monten: alguien tiene que
  # conectarse y correrlos (decisión D-v1-6). Es idempotente: si la base ya
  # existe, no hace nada.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: investigacion-sqlserver-init
    restart: "no"                  # corre una vez; no revive
    environment:
      - MSSQL_SA_PASSWORD=Aplicacionweb123!
    volumes:
      - ./db:/scripts:ro           # solo lectura: lo ejecuta, no lo modifica
    depends_on:
      sqlserver:
        condition: service_healthy # espera a que el motor RESPONDA
    entrypoint: ["/bin/bash", "/scripts/init.sh"]

  # --- La API: C# / ASP.NET Core, con el codigo montado y dotnet watch ---
  api-investigacion:
    build: ./api_investigacion
    container_name: investigacion-api
    restart: unless-stopped
    ports:
      - "8070:8070"                # el MISMO numero adentro y afuera
    volumes:
      - ./api_investigacion:/app   # el codigo montado: guardar un .cs recompila solo
      - /app/bin                   # bin y obj quedan DENTRO del contenedor (Linux),
      - /app/obj                   #   sin mezclarse con los compilados de Windows
    environment:
      # El host es el NOMBRE del servicio, no localhost: dentro de la red de compose
      # los servicios se resuelven por nombre. El doble guion bajo hace que ASP.NET
      # lea esto como ConnectionStrings:SqlServer y SOBREESCRIBA appsettings.json.
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=investigacion_local;User Id=sa;Password=Aplicacionweb123!;TrustServerCertificate=True;
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully   # espera a que la base este SEMBRADA

  # --- El FRONT: Blazor Server, C#/.NET ---------------------------------
  front-blazor:
    build: ./front_blazor
    container_name: investigacion-front
    restart: unless-stopped
    ports:
      - "8071:8071"                # http://localhost:8071
    volumes:
      - ./front_blazor:/app        # el código montado: guardar un .razor recompila solo
      - /app/bin                   # bin y obj quedan DENTRO del contenedor
      - /app/obj
    environment:
      # El NOMBRE del servicio, no localhost: dentro del contenedor del front,
      # localhost sería el front mismo.
      - UrlApi=http://api-investigacion:8070
    depends_on:
      - api-investigacion
      # NO depende de sqlserver, y eso no es un olvido: el front no tiene nada
      # que hacer con la base. Si algún día necesitara esa dependencia, sería
      # la señal de que alguien rompió la arquitectura.

volumes:
  mssqldata:                       # la "memoria" de la base: sobrevive a `down`
